<body>
  <div id="__bundler_placeholder">Loading MultiValue Basic Utility (MVBU) for VS Code...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\nbody{margin:0;background:#ffffff}\na{color:#7a5300}a:hover{color:#1d1a14}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; color: #1d1a14; background: #ffffff; line-height: 1.55; font-size: 17px\" data-canvas-width=\"1280\" data-canvas-height=\"5200\">\n\n<header style=\"background: #1d1a14; border-bottom: 4px solid {{accent}}\">\n<nav aria-label=\"Main\" style=\"max-width: 1160px; margin: 0 auto; padding: 18px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 28px\">\n<a href=\"#top\" style=\"display: flex; align-items: center; gap: 12px; text-decoration: none; color: #ffffff; flex: 1 1 auto\">\n<img src=\"4d234ccf-b443-413d-97f4-07e7cbde92ee\" alt=\"\" width=\"36\" height=\"36\" style=\"width: 36px; height: 36px; border-radius: 8px\">\n<span style=\"font-weight: 700; font-size: 17px; letter-spacing: -0.01em\">MultiValue Basic Utility<\u002Fspan>\n<\u002Fa>\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; font-size: 15px\">\n<a href=\"#features\" style=\"color: #e8e2d4; text-decoration: none\">Features<\u002Fa>\n<a href=\"#how\" style=\"color: #e8e2d4; text-decoration: none\">How it works<\u002Fa>\n<a href=\"#start\" style=\"color: #e8e2d4; text-decoration: none\">Get started<\u002Fa>\n<a href=\"#support\" style=\"color: #e8e2d4; text-decoration: none\">Support<\u002Fa>\n<a href=\"#start\" style=\"background: {{accent}}; color: #1d1a14; text-decoration: none; font-weight: 700; padding: 10px 18px; border-radius: 8px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center\">Download<\u002Fa>\n<\u002Fdiv>\n<\u002Fnav>\n<\u002Fheader>\n\n<section id=\"top\" style=\"background: #1d1a14; color: #ffffff; padding: 72px 24px 96px\">\n<div style=\"max-width: 1160px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 56px; align-items: center\">\n<div style=\"flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 24px\">\n<p style=\"margin: 0; display: inline-flex; align-self: flex-start; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: #1d1a14; background: {{accent}}; padding: 6px 12px; border-radius: 999px\">VS Code extension for Rocket UniVerse and UniData<\u002Fp>\n<h1 style=\"margin: 0; font-size: clamp(40px, 5.2vw, 64px); line-height: 1.05; font-weight: 800; letter-spacing: -0.03em\">Your MultiValue data, in plain language.<\u002Fh1>\n<p style=\"margin: 0; font-size: 20px; color: #d9d2c3; max-width: 34em\">MultiValue Basic Utility (MVBU) lets business analysts look up and find records without writing TCL, and gives developers a full-width console for commands, API calls, schema and compile — all inside Visual Studio Code.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px\">\n<a href=\"#start\" style=\"background: {{accent}}; color: #1d1a14; text-decoration: none; font-weight: 700; font-size: 17px; padding: 14px 24px; border-radius: 10px; min-height: 48px; box-sizing: border-box; display: inline-flex; align-items: center\">Get MVBU for VS Code<\u002Fa>\n<a href=\"#how\" style=\"color: #ffffff; text-decoration: none; font-weight: 600; font-size: 17px; padding: 14px 24px; border-radius: 10px; border: 1px solid #5a5446; min-height: 48px; box-sizing: border-box; display: inline-flex; align-items: center\">See how it works<\u002Fa>\n<\u002Fdiv>\n<ul style=\"margin: 8px 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 8px 24px; font-size: 14px; color: #cfc8b8\">\n<li style=\"display: flex; align-items: center; gap: 8px\"><svg aria-hidden=\"true\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#ffc61a\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>Windows, macOS and Linux<\u002Fli>\n<li style=\"display: flex; align-items: center; gap: 8px\"><svg aria-hidden=\"true\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#ffc61a\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>Nothing installed on the server<\u002Fli>\n<li style=\"display: flex; align-items: center; gap: 8px\"><svg aria-hidden=\"true\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#ffc61a\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>UniRPC over SSL<\u002Fli>\n<li style=\"display: flex; align-items: center; gap: 8px\"><svg aria-hidden=\"true\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#ffc61a\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>Free and open source (GPL-2.0)<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<figure style=\"flex: 1 1 520px; min-width: 0; margin: 0\">\n<img src=\"fa184e11-bcd8-4938-a862-f121894d97cd\" alt=\"The MVBU Analyst view in VS Code, finding drama titles in a PRODUCTS file with a step-by-step search\" style=\"width: 100%; height: auto; display: block; border-radius: 12px; border: 1px solid #3a352b; box-shadow: 0 24px 60px rgba(0,0,0,0.45)\">\n<\u002Ffigure>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section aria-labelledby=\"who\" style=\"padding: 88px 24px 40px\">\n<div style=\"max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px\">\n<div style=\"max-width: 760px; display: flex; flex-direction: column; gap: 12px\">\n<h2 id=\"who\" style=\"margin: 0; font-size: 40px; line-height: 1.15; font-weight: 800; letter-spacing: -0.02em\">One extension, two ways of working<\u002Fh2>\n<p style=\"margin: 0; font-size: 19px; color: #5e584c\">The same connection, history and saved output serve the people who read the data and the people who build on it.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px\">\n<article style=\"background: #fff8dc; border: 1px solid #f2dc8f; border-radius: 16px; padding: 32px; display: flex; flex-direction: column; gap: 16px\">\n<div style=\"display: flex; align-items: center; gap: 12px\">\n<span style=\"width: 44px; height: 44px; border-radius: 10px; background: {{accent}}; display: inline-flex; align-items: center; justify-content: center\"><svg aria-hidden=\"true\" width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1d1a14\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"m20 20-3.5-3.5\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<h3 style=\"margin: 0; font-size: 24px; font-weight: 700\">Analyst view<\u002Fh3>\n<\u002Fdiv>\n<p style=\"margin: 0; color: #4a4439\">For business analysts. No query language, no field numbers, no special characters.<\u002Fp>\n<ul style=\"margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px\">\n<li><strong>Look up a record<\u002Fstrong> with every field labelled by its dictionary heading.<\u002Fli>\n<li><strong>Find records<\u002Fstrong> with a step-by-step builder and a plain-English summary before it runs.<\u002Fli>\n<li><strong>What's in a file<\u002Fstrong>: every field, what it holds and what kind of value it is.<\u002Fli>\n<li><strong>Saved actions<\u002Fstrong> your team has set up, with friendly labels and help.<\u002Fli>\n<li>Dates, times and decimals shown readably; tables copy straight into Excel.<\u002Fli>\n<\u002Ful>\n<\u002Farticle>\n<article style=\"background: #f6f4ee; border: 1px solid #e3ddcf; border-radius: 16px; padding: 32px; display: flex; flex-direction: column; gap: 16px\">\n<div style=\"display: flex; align-items: center; gap: 12px\">\n<span style=\"width: 44px; height: 44px; border-radius: 10px; background: #1d1a14; display: inline-flex; align-items: center; justify-content: center\"><svg aria-hidden=\"true\" width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#ffc61a\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 8 4 4-4 4\"><\u002Fpath><path d=\"M12 16h7\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<h3 style=\"margin: 0; font-size: 24px; font-weight: 700\">Developer console<\u002Fh3>\n<\u002Fdiv>\n<p style=\"margin: 0; color: #4a4439\">For developers and support. Full-width output instead of a 24 × 80 terminal.<\u002Fp>\n<ul style=\"margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px\">\n<li><strong>Command<\u002Fstrong>: run TCL/ECL, several lines at once, with prompts answered in VS Code.<\u002Fli>\n<li><strong>API Call<\u002Fstrong>: call catalogued subroutines, paste XML requests, label results from a dictionary.<\u002Fli>\n<li><strong>Schema<\u002Fstrong>: dictionary, layout and record views of any file.<\u002Fli>\n<li><strong>Compile<\u002Fstrong>: compile and catalogue from the editor with your own templates.<\u002Fli>\n<li>History, favourites and pinned files to repeat work in one click.<\u002Fli>\n<\u002Ful>\n<\u002Farticle>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"features\" aria-labelledby=\"features-h\" style=\"padding: 56px 24px 88px\">\n<div style=\"max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px\">\n<h2 id=\"features-h\" style=\"margin: 0; font-size: 40px; line-height: 1.15; font-weight: 800; letter-spacing: -0.02em\">Built for everyday MultiValue work<\u002Fh2>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px\">\n<div style=\"border: 1px solid #e3ddcf; border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 10px\">\n<svg aria-hidden=\"true\" width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1d1a14\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"m20 20-3.5-3.5\"><\u002Fpath><path d=\"M8 11h6\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 0; font-size: 19px; font-weight: 700\">Find in results<\u002Fh3>\n<p style=\"margin: 0; color: #5e584c; font-size: 16px\">Ctrl+F (Cmd+F) searches any output, with match count and highlighting.<\u002Fp>\n<\u002Fdiv>\n<div style=\"border: 1px solid #e3ddcf; border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 10px\">\n<svg aria-hidden=\"true\" width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1d1a14\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z\"><\u002Fpath><path d=\"M14 3v5h5\"><\u002Fpath><path d=\"M9 13h6M9 17h4\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 0; font-size: 19px; font-weight: 700\">Saved Markdown output<\u002Fh3>\n<p style=\"margin: 0; color: #5e584c; font-size: 16px\">Every run is saved with a timestamp, ready to review, attach or share.<\u002Fp>\n<\u002Fdiv>\n<div style=\"border: 1px solid #e3ddcf; border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 10px\">\n<svg aria-hidden=\"true\" width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1d1a14\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 8v5\"><\u002Fpath><path d=\"M12 16.5v.5\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 0; font-size: 19px; font-weight: 700\">Errors you can act on<\u002Fh3>\n<p style=\"margin: 0; color: #5e584c; font-size: 16px\">Server errors such as 81009, 30105 and 30106 come with a plain explanation and a fix.<\u002Fp>\n<\u002Fdiv>\n<div style=\"border: 1px solid #e3ddcf; border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 10px\">\n<svg aria-hidden=\"true\" width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1d1a14\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3 4 6v6c0 4.5 3.4 8 8 9 4.6-1 8-4.5 8-9V6z\"><\u002Fpath><path d=\"m9 12 2 2 4-4\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 0; font-size: 19px; font-weight: 700\">Safe on production<\u002Fh3>\n<p style=\"margin: 0; color: #5e584c; font-size: 16px\">Profiles can ask before every run. Passwords stay in VS Code Secret Storage.<\u002Fp>\n<\u002Fdiv>\n<div style=\"border: 1px solid #e3ddcf; border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 10px\">\n<svg aria-hidden=\"true\" width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1d1a14\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 7v5l3 2\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 0; font-size: 19px; font-weight: 700\">Licence-friendly sessions<\u002Fh3>\n<p style=\"margin: 0; color: #5e584c; font-size: 16px\">One session per connection, closed after idle time and reopened on the next run.<\u002Fp>\n<\u002Fdiv>\n<div style=\"border: 1px solid #e3ddcf; border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 10px\">\n<svg aria-hidden=\"true\" width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1d1a14\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><ellipse cx=\"12\" cy=\"6\" rx=\"7\" ry=\"3\"><\u002Fellipse><path d=\"M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6\"><\u002Fpath><path d=\"M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 0; font-size: 19px; font-weight: 700\">Mock mode<\u002Fh3>\n<p style=\"margin: 0; color: #5e584c; font-size: 16px\">Try every feature with sample data before you connect to a server.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section aria-labelledby=\"console-h\" style=\"background: #f6f4ee; padding: 88px 24px\">\n<div style=\"max-width: 1160px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 48px; align-items: center\">\n<div style=\"flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 16px\">\n<h2 id=\"console-h\" style=\"margin: 0; font-size: 40px; line-height: 1.15; font-weight: 800; letter-spacing: -0.02em\">Output at full width<\u002Fh2>\n<p style=\"margin: 0; font-size: 18px; color: #4a4439\">Wide <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 15px; background: #ffffff; padding: 2px 6px; border-radius: 4px; border: 1px solid #e3ddcf\">LIST<\u002Fcode> reports, dictionaries and subroutine results stay readable. The inputs take as little room as possible, and one click hides them altogether.<\u002Fp>\n<p style=\"margin: 0; font-size: 18px; color: #4a4439\">Type dynamic arrays with <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 15px\">^ ] \\<\u002Fcode>, or send XML exactly as typed. Returned records are broken down by field, value and sub-value and named from the dictionary you choose.<\u002Fp>\n<\u002Fdiv>\n<figure style=\"flex: 1 1 560px; min-width: 0; margin: 0\">\n<img src=\"50ec83cf-d61b-48b5-ba4e-b0f2e952c6ff\" alt=\"The MVBU Developer console in VS Code showing LIST DICT PRODUCTS output, with the find bar highlighting the word award\" style=\"width: 100%; height: auto; display: block; border-radius: 12px; border: 1px solid #d6cfbf; box-shadow: 0 18px 44px rgba(29,26,20,0.18)\">\n<\u002Ffigure>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"how\" aria-labelledby=\"how-h\" style=\"padding: 88px 24px\">\n<div style=\"max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px\">\n<div style=\"max-width: 760px; display: flex; flex-direction: column; gap: 12px\">\n<h2 id=\"how-h\" style=\"margin: 0; font-size: 40px; line-height: 1.15; font-weight: 800; letter-spacing: -0.02em\">How it works<\u002Fh2>\n<p style=\"margin: 0; font-size: 19px; color: #5e584c\">MVBU runs on your computer and talks to the database through Rocket's own UniObjects library. There is no gateway and nothing to install on the server.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; align-items: stretch; gap: 12px\">\n<div style=\"flex: 1 1 200px; border: 2px solid #1d1a14; border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 6px\">\n<p style=\"margin: 0; font-size: 13px; font-weight: 600; color: #7a5300; text-transform: uppercase; letter-spacing: 0.06em\">Your computer<\u002Fp>\n<p style=\"margin: 0; font-size: 20px; font-weight: 700\">VS Code + MVBU<\u002Fp>\n<p style=\"margin: 0; font-size: 15px; color: #5e584c\">Analyst view and Developer console<\u002Fp>\n<\u002Fdiv>\n<div aria-hidden=\"true\" style=\"flex: 0 0 auto; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 0 4px; color: #5e584c; font-size: 13px; font-weight: 600\">JSON<span style=\"font-size: 26px; line-height: 1; color: #1d1a14\">→<\u002Fspan><\u002Fdiv>\n<div style=\"flex: 1 1 200px; border: 2px solid #1d1a14; border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 6px\">\n<p style=\"margin: 0; font-size: 13px; font-weight: 600; color: #7a5300; text-transform: uppercase; letter-spacing: 0.06em\">Your computer<\u002Fp>\n<p style=\"margin: 0; font-size: 20px; font-weight: 700\">MVBU helper<\u002Fp>\n<p style=\"margin: 0; font-size: 15px; color: #5e584c\">Python with Rocket uopy<\u002Fp>\n<\u002Fdiv>\n<div aria-hidden=\"true\" style=\"flex: 0 0 auto; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 0 4px; color: #5e584c; font-size: 13px; font-weight: 600\">UniRPC / SSL<span style=\"font-size: 26px; line-height: 1; color: #1d1a14\">→<\u002Fspan><\u002Fdiv>\n<div style=\"flex: 1 1 200px; background: #1d1a14; color: #ffffff; border: 2px solid #1d1a14; border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 6px\">\n<p style=\"margin: 0; font-size: 13px; font-weight: 600; color: #ffc61a; text-transform: uppercase; letter-spacing: 0.06em\">Database server<\u002Fp>\n<p style=\"margin: 0; font-size: 20px; font-weight: 700\">UniVerse or UniData<\u002Fp>\n<p style=\"margin: 0; font-size: 15px; color: #cfc8b8\">Unchanged — nothing installed<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"start\" aria-labelledby=\"start-h\" style=\"background: #1d1a14; color: #ffffff; padding: 88px 24px\">\n<div style=\"max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px\">\n<h2 id=\"start-h\" style=\"margin: 0; font-size: 40px; line-height: 1.15; font-weight: 800; letter-spacing: -0.02em\">Get started in four steps<\u002Fh2>\n<ol style=\"margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px\">\n<li style=\"background: #2a261e; border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 10px\">\n<span style=\"width: 36px; height: 36px; border-radius: 50%; background: {{accent}}; color: #1d1a14; font-weight: 800; display: inline-flex; align-items: center; justify-content: center\">1<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 19px; font-weight: 700\">Install Python and uopy<\u002Fh3>\n<code style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px; background: #14120e; color: #ffe08a; padding: 10px 12px; border-radius: 8px; overflow-x: auto; white-space: nowrap\">python3 -m pip install uopy<\u002Fcode>\n<\u002Fli>\n<li style=\"background: #2a261e; border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 10px\">\n<span style=\"width: 36px; height: 36px; border-radius: 50%; background: {{accent}}; color: #1d1a14; font-weight: 800; display: inline-flex; align-items: center; justify-content: center\">2<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 19px; font-weight: 700\">Install the extension<\u002Fh3>\n<code style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px; background: #14120e; color: #ffe08a; padding: 10px 12px; border-radius: 8px; overflow-x: auto; white-space: nowrap\">code --install-extension mvbu-0.3.1.vsix<\u002Fcode>\n<\u002Fli>\n<li style=\"background: #2a261e; border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 10px\">\n<span style=\"width: 36px; height: 36px; border-radius: 50%; background: {{accent}}; color: #1d1a14; font-weight: 800; display: inline-flex; align-items: center; justify-content: center\">3<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 19px; font-weight: 700\">Add a connection<\u002Fh3>\n<p style=\"margin: 0; color: #cfc8b8; font-size: 16px\">Open the MultiValue Basic Utility icon in the Activity Bar and click + under Connections.<\u002Fp>\n<\u002Fli>\n<li style=\"background: #2a261e; border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 10px\">\n<span style=\"width: 36px; height: 36px; border-radius: 50%; background: {{accent}}; color: #1d1a14; font-weight: 800; display: inline-flex; align-items: center; justify-content: center\">4<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 19px; font-weight: 700\">Open MVBU<\u002Fh3>\n<p style=\"margin: 0; color: #cfc8b8; font-size: 16px\">Press Ctrl+Alt+M (Cmd+Alt+M on macOS) and look up your first record.<\u002Fp>\n<\u002Fli>\n<\u002Fol>\n<div style=\"display: flex; flex-wrap: wrap; gap: 16px; align-items: center\">\n<a href=\"[DOWNLOAD LINK]\" style=\"background: {{accent}}; color: #1d1a14; text-decoration: none; font-weight: 700; font-size: 17px; padding: 14px 24px; border-radius: 10px; min-height: 48px; box-sizing: border-box; display: inline-flex; align-items: center\">Download MVBU 0.3.1 for VS Code<\u002Fa>\n<p style=\"margin: 0; font-size: 15px; color: #cfc8b8\">Requires VS Code 1.85+, Python 3.8+ and a UniVerse or UniData server with UniRPC and SSL.<\u002Fp>\n<\u002Fdiv>\n<div style=\"border-top: 1px solid #3a352b; padding-top: 28px; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center\">\n<p style=\"margin: 0; font-size: 17px; flex: 1 1 360px\"><strong>Prefer the browser?<\u002Fstrong> <span style=\"color: #cfc8b8\">The same Analyst view and Developer console are available for Chrome and Edge.<\u002Fspan><\u002Fp>\n<a href=\"[CHROME DOWNLOAD LINK]\" style=\"color: #ffc61a; font-weight: 600; text-decoration: underline\">Get the Chrome and Edge edition<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"support\" aria-labelledby=\"support-h\" style=\"padding: 88px 24px\">\n<div style=\"max-width: 1160px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px\">\n<div style=\"background: #fff8dc; border: 1px solid #f2dc8f; border-radius: 16px; padding: 36px; display: flex; flex-direction: column; gap: 14px\">\n<h2 id=\"support-h\" style=\"margin: 0; font-size: 30px; line-height: 1.2; font-weight: 800; letter-spacing: -0.02em\">Support MVBU<\u002Fh2>\n<p style=\"margin: 0; color: #4a4439\">MVBU is free, open-source and independent. If it saves you or your team time, a coffee helps fund new features, fixes and support.<\u002Fp>\n<a href=\"https://buy.stripe.com/00wcN63xR12D6NIgju6EU03\" style=\"align-self: flex-start; background: #1d1a14; color: #ffffff; text-decoration: none; font-weight: 700; padding: 14px 22px; border-radius: 10px; min-height: 48px; box-sizing: border-box; display: inline-flex; align-items: center; gap: 10px\"><svg aria-hidden=\"true\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#ffc61a\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 8h13v5a6 6 0 0 1-6 6h-1a6 6 0 0 1-6-6z\"><\u002Fpath><path d=\"M17 9h1.5a2.5 2.5 0 0 1 0 5H17\"><\u002Fpath><path d=\"M8 3v2M12 3v2\"><\u002Fpath><\u002Fsvg>Buy me a coffee<\u002Fa>\n<\u002Fdiv>\n<div style=\"background: #f6f4ee; border: 1px solid #e3ddcf; border-radius: 16px; padding: 36px; display: flex; flex-direction: column; gap: 14px\">\n<h2 style=\"margin: 0; font-size: 30px; line-height: 1.2; font-weight: 800; letter-spacing: -0.02em\">Questions and ideas<\u002Fh2>\n<p style=\"margin: 0; color: #4a4439\">Report a problem, suggest a feature or share how your team uses MVBU.<\u002Fp>\n<ul style=\"margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px\">\n<li><a href=\"https://github.com/libin-xie/mvbu/issues\" style=\"font-weight: 600\">Report an issue or suggest a feature<\u002Fa><\u002Fli>\n<li><a href=\"https://github.com/libin-xie/mvbu\" style=\"font-weight: 600\">Source code on GitHub<\u002Fa><\u002Fli>\n<li><a href=\"https://clarityascend.com/mvbu\" style=\"font-weight: 600\">Project website<\u002Fa><\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"border-top: 1px solid #e3ddcf; padding: 32px 24px 48px\">\n<div style=\"max-width: 1160px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 12px 32px; justify-content: space-between; font-size: 14px; color: #5e584c\">\n<p style=\"margin: 0\">© 2026 Clarity Ascend. MultiValue Basic Utility (MVBU) is free software under the <a href=\"https://github.com/libin-xie/mvbu/blob/main/LICENSE\">GNU GPL v2<\u002Fa>. <a href=\"https://github.com/libin-xie/mvbu\">GitHub<\u002Fa><\u002Fp>\n<p style=\"margin: 0; max-width: 640px\">Rocket, UniVerse, UniData and uopy are trademarks of Rocket Software, Inc. MVBU is an independent product and is not affiliated with or endorsed by Rocket Software. Visual Studio Code is a trademark of Microsoft Corporation.<\u002Fp>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<sc-if data-dc-static=\"\" value=\"{{ false }}\"><style>x-dc>*{display:none!important}x-dc>[data-dc-static]{display:block!important}<\u002Fstyle>\n\n<div style=\"font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; color: #1d1a14; background: #ffffff; line-height: 1.55; font-size: 17px\" data-canvas-width=\"1280\" data-canvas-height=\"5200\" data-document-role=\"page\" data-label=\"MultiValue Basic Utility — VS Code extension\">\n\n<header style=\"background: #1d1a14; border-bottom: 4px solid #FFC61A\">\n<nav aria-label=\"Main\" style=\"max-width: 1160px; margin: 0 auto; padding: 18px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 28px\">\n<a href=\"#top\" style=\"display: flex; align-items: center; gap: 12px; text-decoration: none; color: #ffffff; flex: 1 1 auto\">\n<img src=\"4d234ccf-b443-413d-97f4-07e7cbde92ee\" alt=\"\" width=\"36\" height=\"36\" style=\"width: 36px; height: 36px; border-radius: 8px\">\n<span style=\"font-weight: 700; font-size: 17px; letter-spacing: -0.01em\">MultiValue Basic Utility<\u002Fspan>\n<\u002Fa>\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; font-size: 15px\">\n<a href=\"#features\" style=\"color: #e8e2d4; text-decoration: none\">Features<\u002Fa>\n<a href=\"#how\" style=\"color: #e8e2d4; text-decoration: none\">How it works<\u002Fa>\n<a href=\"#start\" style=\"color: #e8e2d4; text-decoration: none\">Get started<\u002Fa>\n<a href=\"#support\" style=\"color: #e8e2d4; text-decoration: none\">Support<\u002Fa>\n<a href=\"#start\" style=\"background: #FFC61A; color: #1d1a14; text-decoration: none; font-weight: 700; padding: 10px 18px; border-radius: 8px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center\">Download<\u002Fa>\n<\u002Fdiv>\n<\u002Fnav>\n<\u002Fheader>\n\n<section id=\"top\" style=\"background: #1d1a14; color: #ffffff; padding: 72px 24px 96px\">\n<div style=\"max-width: 1160px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 56px; align-items: center\">\n<div style=\"flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 24px\">\n<p style=\"margin: 0; display: inline-flex; align-self: flex-start; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: #1d1a14; background: #FFC61A; padding: 6px 12px; border-radius: 999px\">VS Code extension for Rocket UniVerse and UniData<\u002Fp>\n<h1 style=\"margin: 0; font-size: clamp(40px, 5.2vw, 64px); line-height: 1.05; font-weight: 800; letter-spacing: -0.03em\">Your MultiValue data, in plain language.<\u002Fh1>\n<p style=\"margin: 0; font-size: 20px; color: #d9d2c3; max-width: 34em\">MultiValue Basic Utility (MVBU) lets business analysts look up and find records without writing TCL, and gives developers a full-width console for commands, API calls, schema and compile — all inside Visual Studio Code.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px\">\n<a href=\"#start\" style=\"background: #FFC61A; color: #1d1a14; text-decoration: none; font-weight: 700; font-size: 17px; padding: 14px 24px; border-radius: 10px; min-height: 48px; box-sizing: border-box; display: inline-flex; align-items: center\">Get MVBU for VS Code<\u002Fa>\n<a href=\"#how\" style=\"color: #ffffff; text-decoration: none; font-weight: 600; font-size: 17px; padding: 14px 24px; border-radius: 10px; border: 1px solid #5a5446; min-height: 48px; box-sizing: border-box; display: inline-flex; align-items: center\">See how it works<\u002Fa>\n<\u002Fdiv>\n<ul style=\"margin: 8px 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 8px 24px; font-size: 14px; color: #cfc8b8\">\n<li style=\"display: flex; align-items: center; gap: 8px\"><svg aria-hidden=\"true\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#ffc61a\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>Windows, macOS and Linux<\u002Fli>\n<li style=\"display: flex; align-items: center; gap: 8px\"><svg aria-hidden=\"true\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#ffc61a\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>Nothing installed on the server<\u002Fli>\n<li style=\"display: flex; align-items: center; gap: 8px\"><svg aria-hidden=\"true\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#ffc61a\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>UniRPC over SSL<\u002Fli>\n<li style=\"display: flex; align-items: center; gap: 8px\"><svg aria-hidden=\"true\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#ffc61a\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>Free and open source (GPL-2.0)<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<figure style=\"flex: 1 1 520px; min-width: 0; margin: 0\">\n<img src=\"fa184e11-bcd8-4938-a862-f121894d97cd\" alt=\"The MVBU Analyst view in VS Code, finding drama titles in a PRODUCTS file with a step-by-step search\" style=\"width: 100%; height: auto; display: block; border-radius: 12px; border: 1px solid #3a352b; box-shadow: 0 24px 60px rgba(0,0,0,0.45)\">\n<\u002Ffigure>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section aria-labelledby=\"who\" style=\"padding: 88px 24px 40px\">\n<div style=\"max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px\">\n<div style=\"max-width: 760px; display: flex; flex-direction: column; gap: 12px\">\n<h2 id=\"who\" style=\"margin: 0; font-size: 40px; line-height: 1.15; font-weight: 800; letter-spacing: -0.02em\">One extension, two ways of working<\u002Fh2>\n<p style=\"margin: 0; font-size: 19px; color: #5e584c\">The same connection, history and saved output serve the people who read the data and the people who build on it.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px\">\n<article style=\"background: #fff8dc; border: 1px solid #f2dc8f; border-radius: 16px; padding: 32px; display: flex; flex-direction: column; gap: 16px\">\n<div style=\"display: flex; align-items: center; gap: 12px\">\n<span style=\"width: 44px; height: 44px; border-radius: 10px; background: #FFC61A; display: inline-flex; align-items: center; justify-content: center\"><svg aria-hidden=\"true\" width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1d1a14\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"m20 20-3.5-3.5\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<h3 style=\"margin: 0; font-size: 24px; font-weight: 700\">Analyst view<\u002Fh3>\n<\u002Fdiv>\n<p style=\"margin: 0; color: #4a4439\">For business analysts. No query language, no field numbers, no special characters.<\u002Fp>\n<ul style=\"margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px\">\n<li><strong>Look up a record<\u002Fstrong> with every field labelled by its dictionary heading.<\u002Fli>\n<li><strong>Find records<\u002Fstrong> with a step-by-step builder and a plain-English summary before it runs.<\u002Fli>\n<li><strong>What's in a file<\u002Fstrong>: every field, what it holds and what kind of value it is.<\u002Fli>\n<li><strong>Saved actions<\u002Fstrong> your team has set up, with friendly labels and help.<\u002Fli>\n<li>Dates, times and decimals shown readably; tables copy straight into Excel.<\u002Fli>\n<\u002Ful>\n<\u002Farticle>\n<article style=\"background: #f6f4ee; border: 1px solid #e3ddcf; border-radius: 16px; padding: 32px; display: flex; flex-direction: column; gap: 16px\">\n<div style=\"display: flex; align-items: center; gap: 12px\">\n<span style=\"width: 44px; height: 44px; border-radius: 10px; background: #1d1a14; display: inline-flex; align-items: center; justify-content: center\"><svg aria-hidden=\"true\" width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#ffc61a\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 8 4 4-4 4\"><\u002Fpath><path d=\"M12 16h7\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<h3 style=\"margin: 0; font-size: 24px; font-weight: 700\">Developer console<\u002Fh3>\n<\u002Fdiv>\n<p style=\"margin: 0; color: #4a4439\">For developers and support. Full-width output instead of a 24 × 80 terminal.<\u002Fp>\n<ul style=\"margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px\">\n<li><strong>Command<\u002Fstrong>: run TCL/ECL, several lines at once, with prompts answered in VS Code.<\u002Fli>\n<li><strong>API Call<\u002Fstrong>: call catalogued subroutines, paste XML requests, label results from a dictionary.<\u002Fli>\n<li><strong>Schema<\u002Fstrong>: dictionary, layout and record views of any file.<\u002Fli>\n<li><strong>Compile<\u002Fstrong>: compile and catalogue from the editor with your own templates.<\u002Fli>\n<li>History, favourites and pinned files to repeat work in one click.<\u002Fli>\n<\u002Ful>\n<\u002Farticle>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"features\" aria-labelledby=\"features-h\" style=\"padding: 56px 24px 88px\">\n<div style=\"max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px\">\n<h2 id=\"features-h\" style=\"margin: 0; font-size: 40px; line-height: 1.15; font-weight: 800; letter-spacing: -0.02em\">Built for everyday MultiValue work<\u002Fh2>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px\">\n<div style=\"border: 1px solid #e3ddcf; border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 10px\">\n<svg aria-hidden=\"true\" width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1d1a14\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"m20 20-3.5-3.5\"><\u002Fpath><path d=\"M8 11h6\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 0; font-size: 19px; font-weight: 700\">Find in results<\u002Fh3>\n<p style=\"margin: 0; color: #5e584c; font-size: 16px\">Ctrl+F (Cmd+F) searches any output, with match count and highlighting.<\u002Fp>\n<\u002Fdiv>\n<div style=\"border: 1px solid #e3ddcf; border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 10px\">\n<svg aria-hidden=\"true\" width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1d1a14\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z\"><\u002Fpath><path d=\"M14 3v5h5\"><\u002Fpath><path d=\"M9 13h6M9 17h4\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 0; font-size: 19px; font-weight: 700\">Saved Markdown output<\u002Fh3>\n<p style=\"margin: 0; color: #5e584c; font-size: 16px\">Every run is saved with a timestamp, ready to review, attach or share.<\u002Fp>\n<\u002Fdiv>\n<div style=\"border: 1px solid #e3ddcf; border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 10px\">\n<svg aria-hidden=\"true\" width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1d1a14\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 8v5\"><\u002Fpath><path d=\"M12 16.5v.5\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 0; font-size: 19px; font-weight: 700\">Errors you can act on<\u002Fh3>\n<p style=\"margin: 0; color: #5e584c; font-size: 16px\">Server errors such as 81009, 30105 and 30106 come with a plain explanation and a fix.<\u002Fp>\n<\u002Fdiv>\n<div style=\"border: 1px solid #e3ddcf; border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 10px\">\n<svg aria-hidden=\"true\" width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1d1a14\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3 4 6v6c0 4.5 3.4 8 8 9 4.6-1 8-4.5 8-9V6z\"><\u002Fpath><path d=\"m9 12 2 2 4-4\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 0; font-size: 19px; font-weight: 700\">Safe on production<\u002Fh3>\n<p style=\"margin: 0; color: #5e584c; font-size: 16px\">Profiles can ask before every run. Passwords stay in VS Code Secret Storage.<\u002Fp>\n<\u002Fdiv>\n<div style=\"border: 1px solid #e3ddcf; border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 10px\">\n<svg aria-hidden=\"true\" width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1d1a14\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 7v5l3 2\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 0; font-size: 19px; font-weight: 700\">Licence-friendly sessions<\u002Fh3>\n<p style=\"margin: 0; color: #5e584c; font-size: 16px\">One session per connection, closed after idle time and reopened on the next run.<\u002Fp>\n<\u002Fdiv>\n<div style=\"border: 1px solid #e3ddcf; border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 10px\">\n<svg aria-hidden=\"true\" width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1d1a14\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><ellipse cx=\"12\" cy=\"6\" rx=\"7\" ry=\"3\"><\u002Fellipse><path d=\"M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6\"><\u002Fpath><path d=\"M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 0; font-size: 19px; font-weight: 700\">Mock mode<\u002Fh3>\n<p style=\"margin: 0; color: #5e584c; font-size: 16px\">Try every feature with sample data before you connect to a server.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section aria-labelledby=\"console-h\" style=\"background: #f6f4ee; padding: 88px 24px\">\n<div style=\"max-width: 1160px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 48px; align-items: center\">\n<div style=\"flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 16px\">\n<h2 id=\"console-h\" style=\"margin: 0; font-size: 40px; line-height: 1.15; font-weight: 800; letter-spacing: -0.02em\">Output at full width<\u002Fh2>\n<p style=\"margin: 0; font-size: 18px; color: #4a4439\">Wide <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 15px; background: #ffffff; padding: 2px 6px; border-radius: 4px; border: 1px solid #e3ddcf\">LIST<\u002Fcode> reports, dictionaries and subroutine results stay readable. The inputs take as little room as possible, and one click hides them altogether.<\u002Fp>\n<p style=\"margin: 0; font-size: 18px; color: #4a4439\">Type dynamic arrays with <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 15px\">^ ] \\<\u002Fcode>, or send XML exactly as typed. Returned records are broken down by field, value and sub-value and named from the dictionary you choose.<\u002Fp>\n<\u002Fdiv>\n<figure style=\"flex: 1 1 560px; min-width: 0; margin: 0\">\n<img src=\"50ec83cf-d61b-48b5-ba4e-b0f2e952c6ff\" alt=\"The MVBU Developer console in VS Code showing LIST DICT PRODUCTS output, with the find bar highlighting the word award\" style=\"width: 100%; height: auto; display: block; border-radius: 12px; border: 1px solid #d6cfbf; box-shadow: 0 18px 44px rgba(29,26,20,0.18)\">\n<\u002Ffigure>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"how\" aria-labelledby=\"how-h\" style=\"padding: 88px 24px\">\n<div style=\"max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px\">\n<div style=\"max-width: 760px; display: flex; flex-direction: column; gap: 12px\">\n<h2 id=\"how-h\" style=\"margin: 0; font-size: 40px; line-height: 1.15; font-weight: 800; letter-spacing: -0.02em\">How it works<\u002Fh2>\n<p style=\"margin: 0; font-size: 19px; color: #5e584c\">MVBU runs on your computer and talks to the database through Rocket's own UniObjects library. There is no gateway and nothing to install on the server.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; align-items: stretch; gap: 12px\">\n<div style=\"flex: 1 1 200px; border: 2px solid #1d1a14; border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 6px\">\n<p style=\"margin: 0; font-size: 13px; font-weight: 600; color: #7a5300; text-transform: uppercase; letter-spacing: 0.06em\">Your computer<\u002Fp>\n<p style=\"margin: 0; font-size: 20px; font-weight: 700\">VS Code + MVBU<\u002Fp>\n<p style=\"margin: 0; font-size: 15px; color: #5e584c\">Analyst view and Developer console<\u002Fp>\n<\u002Fdiv>\n<div aria-hidden=\"true\" style=\"flex: 0 0 auto; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 0 4px; color: #5e584c; font-size: 13px; font-weight: 600\">JSON<span style=\"font-size: 26px; line-height: 1; color: #1d1a14\">→<\u002Fspan><\u002Fdiv>\n<div style=\"flex: 1 1 200px; border: 2px solid #1d1a14; border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 6px\">\n<p style=\"margin: 0; font-size: 13px; font-weight: 600; color: #7a5300; text-transform: uppercase; letter-spacing: 0.06em\">Your computer<\u002Fp>\n<p style=\"margin: 0; font-size: 20px; font-weight: 700\">MVBU helper<\u002Fp>\n<p style=\"margin: 0; font-size: 15px; color: #5e584c\">Python with Rocket uopy<\u002Fp>\n<\u002Fdiv>\n<div aria-hidden=\"true\" style=\"flex: 0 0 auto; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 0 4px; color: #5e584c; font-size: 13px; font-weight: 600\">UniRPC / SSL<span style=\"font-size: 26px; line-height: 1; color: #1d1a14\">→<\u002Fspan><\u002Fdiv>\n<div style=\"flex: 1 1 200px; background: #1d1a14; color: #ffffff; border: 2px solid #1d1a14; border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 6px\">\n<p style=\"margin: 0; font-size: 13px; font-weight: 600; color: #ffc61a; text-transform: uppercase; letter-spacing: 0.06em\">Database server<\u002Fp>\n<p style=\"margin: 0; font-size: 20px; font-weight: 700\">UniVerse or UniData<\u002Fp>\n<p style=\"margin: 0; font-size: 15px; color: #cfc8b8\">Unchanged — nothing installed<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"start\" aria-labelledby=\"start-h\" style=\"background: #1d1a14; color: #ffffff; padding: 88px 24px\">\n<div style=\"max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px\">\n<h2 id=\"start-h\" style=\"margin: 0; font-size: 40px; line-height: 1.15; font-weight: 800; letter-spacing: -0.02em\">Get started in four steps<\u002Fh2>\n<ol style=\"margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px\">\n<li style=\"background: #2a261e; border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 10px\">\n<span style=\"width: 36px; height: 36px; border-radius: 50%; background: #FFC61A; color: #1d1a14; font-weight: 800; display: inline-flex; align-items: center; justify-content: center\">1<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 19px; font-weight: 700\">Install Python and uopy<\u002Fh3>\n<code style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px; background: #14120e; color: #ffe08a; padding: 10px 12px; border-radius: 8px; overflow-x: auto; white-space: nowrap\">python3 -m pip install uopy<\u002Fcode>\n<\u002Fli>\n<li style=\"background: #2a261e; border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 10px\">\n<span style=\"width: 36px; height: 36px; border-radius: 50%; background: #FFC61A; color: #1d1a14; font-weight: 800; display: inline-flex; align-items: center; justify-content: center\">2<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 19px; font-weight: 700\">Install the extension<\u002Fh3>\n<code style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px; background: #14120e; color: #ffe08a; padding: 10px 12px; border-radius: 8px; overflow-x: auto; white-space: nowrap\">code --install-extension mvbu-0.3.1.vsix<\u002Fcode>\n<\u002Fli>\n<li style=\"background: #2a261e; border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 10px\">\n<span style=\"width: 36px; height: 36px; border-radius: 50%; background: #FFC61A; color: #1d1a14; font-weight: 800; display: inline-flex; align-items: center; justify-content: center\">3<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 19px; font-weight: 700\">Add a connection<\u002Fh3>\n<p style=\"margin: 0; color: #cfc8b8; font-size: 16px\">Open the MultiValue Basic Utility icon in the Activity Bar and click + under Connections.<\u002Fp>\n<\u002Fli>\n<li style=\"background: #2a261e; border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 10px\">\n<span style=\"width: 36px; height: 36px; border-radius: 50%; background: #FFC61A; color: #1d1a14; font-weight: 800; display: inline-flex; align-items: center; justify-content: center\">4<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 19px; font-weight: 700\">Open MVBU<\u002Fh3>\n<p style=\"margin: 0; color: #cfc8b8; font-size: 16px\">Press Ctrl+Alt+M (Cmd+Alt+M on macOS) and look up your first record.<\u002Fp>\n<\u002Fli>\n<\u002Fol>\n<div style=\"display: flex; flex-wrap: wrap; gap: 16px; align-items: center\">\n<a href=\"[DOWNLOAD LINK]\" style=\"background: #FFC61A; color: #1d1a14; text-decoration: none; font-weight: 700; font-size: 17px; padding: 14px 24px; border-radius: 10px; min-height: 48px; box-sizing: border-box; display: inline-flex; align-items: center\">Download MVBU 0.3.1 for VS Code<\u002Fa>\n<p style=\"margin: 0; font-size: 15px; color: #cfc8b8\">Requires VS Code 1.85+, Python 3.8+ and a UniVerse or UniData server with UniRPC and SSL.<\u002Fp>\n<\u002Fdiv>\n<div style=\"border-top: 1px solid #3a352b; padding-top: 28px; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center\">\n<p style=\"margin: 0; font-size: 17px; flex: 1 1 360px\"><strong>Prefer the browser?<\u002Fstrong> <span style=\"color: #cfc8b8\">The same Analyst view and Developer console are available for Chrome and Edge.<\u002Fspan><\u002Fp>\n<a href=\"[CHROME DOWNLOAD LINK]\" style=\"color: #ffc61a; font-weight: 600; text-decoration: underline\">Get the Chrome and Edge edition<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"support\" aria-labelledby=\"support-h\" style=\"padding: 88px 24px\">\n<div style=\"max-width: 1160px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px\">\n<div style=\"background: #fff8dc; border: 1px solid #f2dc8f; border-radius: 16px; padding: 36px; display: flex; flex-direction: column; gap: 14px\">\n<h2 id=\"support-h\" style=\"margin: 0; font-size: 30px; line-height: 1.2; font-weight: 800; letter-spacing: -0.02em\">Support MVBU<\u002Fh2>\n<p style=\"margin: 0; color: #4a4439\">MVBU is free, open-source and independent. If it saves you or your team time, a coffee helps fund new features, fixes and support.<\u002Fp>\n<a href=\"https://buy.stripe.com/00wcN63xR12D6NIgju6EU03\" style=\"align-self: flex-start; background: #1d1a14; color: #ffffff; text-decoration: none; font-weight: 700; padding: 14px 22px; border-radius: 10px; min-height: 48px; box-sizing: border-box; display: inline-flex; align-items: center; gap: 10px\"><svg aria-hidden=\"true\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#ffc61a\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 8h13v5a6 6 0 0 1-6 6h-1a6 6 0 0 1-6-6z\"><\u002Fpath><path d=\"M17 9h1.5a2.5 2.5 0 0 1 0 5H17\"><\u002Fpath><path d=\"M8 3v2M12 3v2\"><\u002Fpath><\u002Fsvg>Buy me a coffee<\u002Fa>\n<\u002Fdiv>\n<div style=\"background: #f6f4ee; border: 1px solid #e3ddcf; border-radius: 16px; padding: 36px; display: flex; flex-direction: column; gap: 14px\">\n<h2 style=\"margin: 0; font-size: 30px; line-height: 1.2; font-weight: 800; letter-spacing: -0.02em\">Questions and ideas<\u002Fh2>\n<p style=\"margin: 0; color: #4a4439\">Report a problem, suggest a feature
